<title id="t">Native VLA authorization: paired behavior, faults and cost</title><desc id="d">40 paired episodes: direct baseline and Sentinel both succeed 33/40, all 5420 action bytes unchanged. 60 synthetic faults rejected with 0 forbidden writer calls. Gateway authorize plus admission mean 0.802 ms, P95 1.040 ms. RTX 4090 D (24 GB), fixed engineering grid, not a competitor benchmark.</desc>
