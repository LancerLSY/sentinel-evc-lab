<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc">
<title id="title">Sentinel EVC · integration &amp; execution</title>
<desc id="desc">(a) Before motion: Compare the integration on fixed inputs. (b) At the software writer: Check each request, then retain its evidence</desc>
