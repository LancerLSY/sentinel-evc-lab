<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel EVC execution pipeline</title>
  <desc id="desc">The final-action authorization pipeline from upstream action through transform, physical checks and WorldGuard, a single-use permit, simulation or driver adapter, and signed evidence. A separate research profile feeds experiment evidence without claiming device integration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#287c78"/>
    </marker>
    <marker id="darrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#b0813d"/>
    </marker>
  </defs>
  <rect width="1440" height="500" rx="28" fill="#f8f7f2"/>
  <text x="62" y="58" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#287c78">FINAL-ACTION AUTHORIZATION PATH</text>
  <text x="62" y="88" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#647074">The decision is bound after transforms, then checked again at commit time.</text>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(54 136)">
      <rect width="190" height="128" rx="18" fill="#fff" stroke="#d2d1ca" stroke-width="2"/>
      <circle cx="28" cy="28" r="13" fill="#e9f2f0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#236b68">1</text>
      <text x="24" y="67" font-size="17" font-weight="700" fill="#1b2d33">Upstream action</text>
      <text x="24" y="94" font-size="13" fill="#677377">VLA, planner or</text><text x="24" y="113" font-size="13" fill="#677377">recorded candidate</text>
    </g>
    <g transform="translate(278 136)">
      <rect width="190" height="128" rx="18" fill="#fff" stroke="#d2d1ca" stroke-width="2"/>
      <circle cx="28" cy="28" r="13" fill="#e9f2f0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#236b68">2</text>
      <text x="24" y="67" font-size="17" font-weight="700" fill="#1b2d33">Transform</text>
      <text x="24" y="94" font-size="13" fill="#677377">retime · repair</text><text x="24" y="113" font-size="13" fill="#677377">frame conversion</text>
    </g>
    <g transform="translate(502 120)">
      <rect width="252" height="160" rx="20" fill="#17343b"/>
      <circle cx="30" cy="30" r="13" fill="#2a817c"/><text x="30" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
      <text x="26" y="70" font-size="17" font-weight="700" fill="#fff">Final verification</text>
      <text x="26" y="98" font-size="13" fill="#cfe0de">physical constraints</text>
      <text x="26" y="120" font-size="13" fill="#cfe0de">+ calibrated WorldGuard</text>
      <rect x="26" y="136" width="179" height="2" fill="#2f8984"/>
      <text x="26" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#9fc6c2">deny / unknown / allow</text>
    </g>
    <g transform="translate(788 136)">
      <rect width="190" height="128" rx="18" fill="#fff" stroke="#9fc6c2" stroke-width="2"/>
      <circle cx="28" cy="28" r="13" fill="#287c78"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
      <text x="24" y="67" font-size="17" font-weight="700" fill="#1b2d33">Execution permit</text>
      <text x="24" y="94" font-size="13" fill="#677377">single use · TTL</text><text x="24" y="113" font-size="13" fill="#677377">plan/context bound</text>
    </g>
    <g transform="translate(1012 136)">
      <rect width="190" height="128" rx="18" fill="#fff" stroke="#d2d1ca" stroke-width="2"/>
      <circle cx="28" cy="28" r="13" fill="#e9f2f0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#236b68">5</text>
      <text x="24" y="67" font-size="17" font-weight="700" fill="#1b2d33">Sim / adapter</text>
      <text x="24" y="94" font-size="13" fill="#677377">fresh state check</text><text x="24" y="113" font-size="13" fill="#677377">single writer</text>
    </g>
    <g transform="translate(1236 136)">
      <rect width="150" height="128" rx="18" fill="#fff" stroke="#d2d1ca" stroke-width="2"/>
      <circle cx="28" cy="28" r="13" fill="#e9f2f0"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#236b68">6</text>
      <text x="24" y="67" font-size="17" font-weight="700" fill="#1b2d33">Evidence</text>
      <text x="24" y="94" font-size="13" fill="#677377">hash chain</text><text x="24" y="113" font-size="13" fill="#677377">signed export</text>
    </g>
  </g>

  <g stroke="#287c78" stroke-width="3" marker-end="url(#arrow)">
    <path d="M244 200h28"/><path d="M468 200h28"/><path d="M754 200h28"/><path d="M978 200h28"/><path d="M1202 200h28"/>
  </g>

  <g transform="translate(312 346)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="816" height="96" rx="18" fill="#fffaf0" stroke="#d1aa66" stroke-dasharray="7 6"/>
    <text x="24" y="30" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9a6d2d">SEPARATE RESEARCH PROFILES</text>
    <text x="24" y="56" font-size="14" font-weight="700" fill="#493d2c">MuJoCo contact fixtures · UR5e arm study · camera-shift tests · SSH reproduction</text>
    <text x="24" y="78" font-size="13" fill="#746d61">They produce measured evidence and acceptance results; they do not imply a live robot write adapter.</text>
  </g>
  <path d="M720 346v-60" fill="none" stroke="#b0813d" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#darrow)"/>
</svg>
