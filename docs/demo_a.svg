    <line x1="314.0" y1="494.0" x2="340.0" y2="494.0" stroke="#2d7a4f" stroke-width="3" />
    <text x="347.0" y="498.0" font-size="11.5" fill="#6b6b66">父轨迹 P2（完整检查通过）</text>
    <line x1="564.0" y1="494.0" x2="590.0" y2="494.0" stroke="#b3452f" stroke-width="3" />
    <text x="597.0" y="498.0" font-size="11.5" fill="#6b6b66">0.5·P1 + 0.5·P2（最终动作，穿障）</text>
    <text x="64.0" y="516.0" font-size="11.5" fill="#6b6b66">虚线圈 = 禁区半径 75 mm（球障碍 50 + 工具半径 20 + 跟踪预留 5）</text>
    <text x="64.0" y="538.0" font-size="11.5" fill="#6b6b66">顶视 xy 投影，z 恒为 0.30 m；轨迹是构造的数值样例，不是 VLA 输出、不是真机记录</text>
        <text x="500.0" y="46" font-size="17" font-weight="700" fill="#1a1a18">第一幕 · 变换让旧结论失效</text>
    <text x="500.0" y="68" font-size="12" fill="#6b6b66">同一场景、同一父轨迹、同一批子轨迹，三条判定路径各跑一遍</text>
    <text x="500.0" y="112.0" font-size="11.5" fill="#6b6b66" font-weight="600">判定路径</text>
    <text x="812.0" y="112.0" font-size="11.5" fill="#6b6b66" font-weight="600" text-anchor="end">错误放行的违规轨迹</text>
    <text x="1008.0" y="112.0" font-size="11.5" fill="#6b6b66" font-weight="600" text-anchor="end">完整检查调用</text>
    <line x1="500.0" y1="120.0" x2="1008.0" y2="120.0" stroke="#d8d7d2" stroke-width="1"/>
    <text x="500.0" y="142.0" font-size="13" fill="#1a1a18">a 只验父轨迹就放行</text>
    <text x="812.0" y="142.0" font-size="13.5" font-weight="700" fill="#b3452f" text-anchor="end">500 / 500</text>
    <text x="1008.0" y="142.0" font-size="13.5" fill="#1a1a18" text-anchor="end">0</text>
    <line x1="500.0" y1="153.0" x2="1008.0" y2="153.0" stroke="#d8d7d2" stroke-width=".6" opacity=".7"/>
    <text x="500.0" y="174.0" font-size="13" fill="#1a1a18">b 最终全检（基线）</text>
    <text x="812.0" y="174.0" font-size="13.5" font-weight="700" fill="#2d7a4f" text-anchor="end">0 / 500</text>
    <text x="1008.0" y="174.0" font-size="13.5" fill="#1a1a18" text-anchor="end">1000</text>
    <line x1="500.0" y1="185.0" x2="1008.0" y2="185.0" stroke="#d8d7d2" stroke-width=".6" opacity=".7"/>
    <text x="500.0" y="206.0" font-size="13" fill="#1a1a18">c Δ-Cert + 必要全检</text>
    <text x="812.0" y="206.0" font-size="13.5" font-weight="700" fill="#2d7a4f" text-anchor="end">0 / 500</text>
    <text x="1008.0" y="206.0" font-size="13.5" fill="#1a1a18" text-anchor="end">500</text>
    <line x1="500.0" y1="217.0" x2="1008.0" y2="217.0" stroke="#d8d7d2" stroke-width=".6" opacity=".7"/>
    <text x="500.0" y="252.0" font-size="12" fill="#b3452f">路径 a 那一列就是本项目要解决的问题：500 条真正违规的轨迹被放行。</text>
    <text x="500.0" y="273.0" font-size="12" fill="#6b6b66">安全子轨迹通过 500 / 500 条，误拒 0 条（负对照：这套机制不是「一变就拒」）。</text>
    <text x="500.0" y="294.0" font-size="12" fill="#6b6b66">直接继承 500 次；独立实现交叉验证分歧 0 处。</text>
    <text x="500.0" y="315.0" font-size="12" fill="#6b6b66">完整检查调用减少 50.0% —— 指验证阶段的调用次数，不是整机提速。</text>
    <text x="500.0" y="352.0" font-size="12.5" font-weight="700" fill="#1a1a18">图中这一组（案例 #0）为什么成立</text>
    <text x="500.0" y="376.0" font-size="12" fill="#1a1a18">P1 最小余量 +63.3 mm，P2 +63.3 mm —— 两条父轨迹各自完整检查都通过。</text>
    <text x="500.0" y="399.0" font-size="12" fill="#1a1a18">按 0.5 / 0.5 混合后：最小余量 -75.0 mm，第 6 段起穿过禁区。</text>
    <text x="500.0" y="422.0" font-size="12" fill="#1a1a18">父轨迹的结论对混合结果不成立 —— 这就是本项目要解决的问题。</text>
    <text x="500.0" y="445.0" font-size="12" fill="#1a1a18">Δ-Cert 界不够（父余量扣不掉逐段偏差），回退完整检查 → 判定 REJECTED。</text>
    <text x="500.0" y="468.0" font-size="12" fill="#1a1a18">「界不够」是「无法证明」，不是「一定会碰撞」—— 所以必须真的再查一遍。</text>
    <text x="500.0" y="508.0" font-size="11.5" fill="#6b6b66">复现：python -m sentinel_evc demo --cases 1000 --seed 1234 --out runs/demo_a</text>
    <text x="500.0" y="526.0" font-size="11.5" fill="#6b6b66">本图由同一次运行的输出生成；脚本先跟基线断言，不一致就拒绝出图。</text>
