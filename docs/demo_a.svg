    <text x="57.0" y="172.5" font-size="10.5" fill="#6b6b66" text-anchor="end">0.2</text>
    <text x="57.0" y="77.5" font-size="10.5" fill="#6b6b66" text-anchor="end">0.4</text>
    <text x="254.0" y="488.0" font-size="11" fill="#6b6b66" text-anchor="middle">x（米）</text>
    <text x="24.0" y="264.0" font-size="11" fill="#6b6b66" text-anchor="middle" transform="rotate(-90 24.0 264.0)">y（米）</text>
    <line x1="64.0" y1="494.0" x2="90.0" y2="494.0" stroke="#3a5f8a" stroke-width="3" />
