    <text x="57.0" y="77.5" font-size="10.5" fill="#6b6b66" text-anchor="end">0.4</text>
    <text x="254.0" y="488.0" font-size="11" fill="#6b6b66" text-anchor="middle">x (m)</text>
    <text x="24.0" y="264.0" font-size="11" fill="#6b6b66" text-anchor="middle" transform="rotate(-90 24.0 264.0)">y (m)</text>
    <line x1="64.0" y1="494.0" x2="90.0" y2="494.0" stroke="#3a5f8a" stroke-width="3" />
    <text x="97.0" y="498.0" font-size="11.5" fill="#6b6b66">parent P1 — verified</text>
    <line x1="354.0" y1="494.0" x2="380.0" y2="494.0" stroke="#2d7a4f" stroke-width="3" />
    <text x="387.0" y="498.0" font-size="11.5" fill="#6b6b66">parent P2 — verified</text>
    <line x1="644.0" y1="494.0" x2="670.0" y2="494.0" stroke="#b3452f" stroke-width="3" />
    <text x="677.0" y="498.0" font-size="11.5" fill="#6b6b66">blend 0.5/0.5 — final action, hits obstacle</text>
    <text x="64.0" y="516.0" font-size="11.5" fill="#6b6b66">dashed = keep-out radius 75 mm (sphere 50 + tool 20 + tracking reserve 5)</text>
    <text x="64.0" y="538.0" font-size="11.5" fill="#6b6b66">top-view xy projection, z fixed at 0.30 m; trajectories are constructed numeric samples — not VLA output, not robot logs</text>
        <text x="500.0" y="46" font-size="17" font-weight="700" fill="#1a1a18">Act One · a transform invalidates the earlier verdict</text>
    <text x="500.0" y="68" font-size="12" fill="#6b6b66">Same scene, same parents, same children — three verdict paths run on all of them</text>
    <text x="500.0" y="112.0" font-size="11.5" fill="#6b6b66" font-weight="600">Verdict path</text>
    <text x="812.0" y="112.0" font-size="11.5" fill="#6b6b66" font-weight="600" text-anchor="end">Violating trajectories wrongly released</text>
    <text x="1008.0" y="112.0" font-size="11.5" fill="#6b6b66" font-weight="600" text-anchor="end">Full-check calls</text>
    <line x1="500.0" y1="120.0" x2="1008.0" y2="120.0" stroke="#d8d7d2" stroke-width="1"/>
    <text x="500.0" y="142.0" font-size="13" fill="#1a1a18">a · release on the parent's verdict</text>
    <text x="812.0" y="142.0" font-size="13.5" font-weight="700" fill="#b3452f" text-anchor="end">500 / 500</text>
    <text x="1008.0" y="142.0" font-size="13.5" fill="#1a1a18" text-anchor="end">0</text>
    <line x1="500.0" y1="153.0" x2="1008.0" y2="153.0" stroke="#d8d7d2" stroke-width=".6" opacity=".7"/>
    <text x="500.0" y="174.0" font-size="13" fill="#1a1a18">b · full check every time (baseline)</text>
    <text x="812.0" y="174.0" font-size="13.5" font-weight="700" fill="#2d7a4f" text-anchor="end">0 / 500</text>
    <text x="1008.0" y="174.0" font-size="13.5" fill="#1a1a18" text-anchor="end">1000</text>
    <line x1="500.0" y1="185.0" x2="1008.0" y2="185.0" stroke="#d8d7d2" stroke-width=".6" opacity=".7"/>
    <text x="500.0" y="206.0" font-size="13" fill="#1a1a18">c · Δ-Cert + full check when needed</text>
    <text x="812.0" y="206.0" font-size="13.5" font-weight="700" fill="#2d7a4f" text-anchor="end">0 / 500</text>
    <text x="1008.0" y="206.0" font-size="13.5" fill="#1a1a18" text-anchor="end">500</text>
    <line x1="500.0" y1="217.0" x2="1008.0" y2="217.0" stroke="#d8d7d2" stroke-width=".6" opacity=".7"/>
    <text x="500.0" y="252.0" font-size="12" fill="#b3452f">That first column is the problem: 500 violating trajectories released.</text>
    <text x="500.0" y="273.0" font-size="12" fill="#6b6b66">Safe children passed 500 / 500, false rejections 0 — not "reject any change".</text>
    <text x="500.0" y="294.0" font-size="12" fill="#6b6b66">Inherited 500 times; cross-check disagreements 0.</text>
    <text x="500.0" y="315.0" font-size="12" fill="#6b6b66">Full-check calls reduced 50.0% — verification stage only, not a system speedup.</text>
    <text x="500.0" y="352.0" font-size="12.5" font-weight="700" fill="#1a1a18">Why this case (#0) holds</text>
    <text x="500.0" y="376.0" font-size="12" fill="#1a1a18">P1 min margin +67.7 mm, P2 +75.0 mm — both parents pass on their own.</text>
    <text x="500.0" y="399.0" font-size="12" fill="#1a1a18">Blended 0.5 / 0.5: min margin -68.1 mm, keep-out zone at segment 6.</text>
    <text x="500.0" y="422.0" font-size="12" fill="#1a1a18">The parent's verdict does not hold for the blend — the problem here.</text>
    <text x="500.0" y="445.0" font-size="12" fill="#1a1a18">Δ-Cert bound insufficient: parent margin cannot absorb the per-segment</text>
    <text x="500.0" y="468.0" font-size="12" fill="#1a1a18">deviation, so it falls back to a full check → REJECTED, not "will collide".</text>
    <text x="500.0" y="508.0" font-size="11.5" fill="#6b6b66">Reproduce: python -m sentinel_evc demo --cases 1000 --out runs/demo_a</text>
    <text x="500.0" y="526.0" font-size="11.5" fill="#6b6b66">Generated from that same run; the script asserts the baseline first.</text>
  </g>
</svg>
