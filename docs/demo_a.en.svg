    <circle cx="254.0" cy="264.0" r="4.5" fill="#fff" stroke="#b3452f" stroke-width="2"/>
    <line x1="254.0" y1="264.0" x2="320.0" y2="212.0" stroke="#b3452f" stroke-width="1" opacity=".7"/>
    <text x="324.0" y="208.0" font-size="12" fill="#b3452f" font-weight="600">enters obstacle at segment 6</text>
    <text x="324.0" y="223.0" font-size="12" fill="#b3452f">min margin -68.1 mm</text>
    <circle cx="111.5" cy="264.0" r="3.5" fill="#1a1a18"/>
    <text x="119.5" y="255.0" font-size="11.5" fill="#6b6b66" text-anchor="start">start</text>
    <circle cx="396.5" cy="264.0" r="3.5" fill="#1a1a18"/>
    <text x="388.5" y="255.0" font-size="11.5" fill="#6b6b66" text-anchor="end">goal</text>
    <text x="64.0" y="470.0" font-size="10.5" fill="#6b6b66" text-anchor="middle">0</text>
