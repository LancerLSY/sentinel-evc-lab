name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "setuptools>=68" -e ".[test]"
      - run: python -m pytest -q
      - name: Run the three-act smoke demo
        shell: pwsh
        run: |
          python -m sentinel_evc demo --cases 100 --seed 1234 --out runs/ci
          python -m sentinel_evc verify --bundle runs/ci/bundle --public-key runs/ci/anchors/demo.public --run-id ci

  demo-a:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "setuptools>=68" -e ".[test]"
      - name: Generate the 1000-case bilingual figure
        shell: pwsh
        run: |
          python tools/make_demo_a_figure.py --lang zh --cases 1000 --seed 1234 --out runs/demo_a.svg
          python tools/make_demo_a_figure.py --lang en --cases 1000 --seed 1234 --out runs/demo_a.en.svg
          python tools/check_results.py
          python -m sentinel_evc verify --bundle sample_run/bundle --public-key sample_run/anchors/demo.public --run-id sample_run
      - uses: actions/upload-artifact@v4
        with:
          name: demo-a
          path: |
            runs/demo_a.svg
            runs/demo_a.en.svg
            sample_run/summary.json
            sample_run/report.html
            sample_run/bundle
            sample_run/anchors/demo.public
