name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: 端到端冒烟：跑一次 demo 并独立校验
        run: |
          python -m sentinel_evc demo --cases 100 --out runs/ci --run-id ci
          python -m sentinel_evc verify --bundle runs/ci/bundle \
            --public-key runs/ci/anchors/demo.public --run-id ci
          python -m sentinel_evc tamper --out runs/ci --run-id ci
